[package]
name = "simulator"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "1.0"
nrf52840-hal = { version = "0.19.0", features = ["rt"] }
embedded-hal = "1.0"
rtic = { version = "2.1", features = ["thumbv7-backend"] }
rtic-monotonics = { version = "2.0", features = ["nrf52840"] }
#probe-rs = "0.30.0"

[[bin]]
name = "simulator"
test = false
bench = false

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
